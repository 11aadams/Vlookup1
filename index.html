    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #222;
        }

        /* Main layout */
        .container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            padding: 40px;
            gap: 20px;
        }

        /* =========================
           LEFT SIDE
        ========================= */

        .controls {
            width: 30%;

            background: white;
            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);

            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control label {
            font-size: 15px;
            font-weight: 600;
        }


        /* =========================
           SLIDER
        ========================= */

        .slider-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-row input[type="range"] {
            flex: 1;
            min-width: 0;
        }

        /* Text displayed to the right
           of the slider */

        .slider-value {
            min-width: 90px;

            white-space: nowrap;

            font-size: 15px;
            font-weight: 500;
        }


        /* Slider line */

        input[type="range"] {
            appearance: none;

            width: 100%;
            height: 6px;

            background: #ddd;

            border-radius: 5px;

            outline: none;
        }


        /* Chrome / Safari */

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: #222;

            cursor: pointer;
        }


        /* Firefox */

        input[type="range"]::-moz-range-thumb {
            width: 18px;
            height: 18px;

            border: none;

            border-radius: 50%;

            background: #222;

            cursor: pointer;
        }


        /* =========================
           DROPDOWN
        ========================= */

        select {
            width: 100%;

            padding: 12px;

            border: 1px solid #ccc;

            border-radius: 6px;

            background: white;

            font-size: 15px;

            cursor: pointer;
        }

        select:focus {
            outline: none;

            border-color: #555;
        }


        /* =========================
           RIGHT SIDE
        ========================= */

        .preview {
            width: 70%;

            display: flex;

            align-items: center;
            justify-content: center;

            background: white;

            border-radius: 12px;

            padding: 20px;

            box-shadow:
                0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .preview img {
            max-width: 100%;
            max-height: 80vh;

            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 8px;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .container {
                flex-direction: column;

                padding: 20px;
            }

            .controls,
            .preview {
                width: 100%;
            }

            .preview {
                min-height: 300px;
            }
        }

    </style>
</head>

		  const stateSelect = document.getElementById("state");
const stateImage = document.getElementById("stateImage");
const stateImageR = document.getElementById("stateImageR");

stateSelect.addEventListener("change", function () {

    const stateId = this.value;
    const stateName = this.options[this.selectedIndex].text;

    // LEFT IMAGE — use left lookup
    const leftImageId = statepicLookup[stateId];
    const leftImageURL =
        `https://static.thenounproject.com/png/${leftImageId}-200.png`;

    // RIGHT IMAGE — use right lookup
    const rightImageId = statepicRLookup[stateId];
    const rightImageURL =
        `https://static.thenounproject.com/png/${rightImageId}-512.png`;

    // Fade out
    stateImage.style.transition = "opacity 0.3s ease";
    stateImageR.style.transition = "opacity 0.3s ease";

    stateImage.style.opacity = "0";
    stateImageR.style.opacity = "0";

    setTimeout(() => {

        // Update LEFT image
        stateImage.src = leftImageURL;
        stateImage.alt = stateName;

        // Update RIGHT image
        stateImageR.src = rightImageURL;
        stateImageR.alt = stateName;

        // Fade in
        stateImage.style.opacity = "1";
        stateImageR.style.opacity = "1";

    }, 300);
});

		 function go() {

    // =========================

    const gradeMax = document.getElementById("option2").value;


    // =========================

        `&type=boulder` +

    // =========================
    // OPEN MOUNTAIN PROJECT
    // =========================

    window.open(url, "_blank");
